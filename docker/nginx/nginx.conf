user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    sendfile on;
    keepalive_timeout 65;

    server {
        listen 80;
        server_name localhost;

        # Docker internal DNS resolver
        resolver 127.0.0.11 valid=10s ipv6=off;

        client_max_body_size 100M;

        # Frontend Client
        location / {
            set $target_frontend http://frontend:3000;
            proxy_pass $target_frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Web socket support for development HMR
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Django REST Backend REST Services
        location /api/ {
            set $target_backend http://backend:8000;
            proxy_pass $target_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Django REST Admin Panel
        location /admin/ {
            set $target_admin http://backend:8000;
            proxy_pass $target_admin;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # MapServer OGC Web Map / Web Feature Service Gateway
        location /ogc/ {
            set $target_mapserver "http://mapserver:80/cgi-bin/mapserv?map=/etc/mapserver/mapfile.map&";
            proxy_pass $target_mapserver;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Static Assets
        location /static/ {
            alias /usr/share/nginx/html/static/;
        }

        # Media Assets
        location /media/ {
            alias /usr/share/nginx/html/media/;
        }
    }
}
